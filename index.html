<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机会博弈 (THE TRADE OFF) - 天空之城全景沙盘</title>
<style>
:root {
 --panel-bg: rgba(22, 34, 42, 0.75);
 --nature-green: #4ade80;
 --nature-gold: #fbbf24;
 --nature-sky: #38bdf8;
 --nature-pink: #f472b6;
 --nature-red: #ef4444;
 --nature-purple: #a78bfa;
 --text-light: #f8fafc;
}

* { box-sizing: border-box; }

body {
 font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
 background: linear-gradient(135deg, #1e1b4b 0%, #2e1065 35%, #0f172a 100%);
 margin: 0; padding: 20px; color: var(--text-light);
 min-height: 100vh; position: relative; overflow-x: hidden;
 transition: background 0.3s ease;
}

body::before {
 content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
 background-image:
 radial-gradient(rgba(244, 114, 182, 0.1) 2px, transparent 0),
 radial-gradient(rgba(56, 189, 248, 0.1) 1.5px, transparent 0);
 background-size: 100px 100px, 150px 150px;
 animation: cloudFloat 40s linear infinite; z-index: -1; pointer-events: none;
}
@keyframes cloudFloat { 0% { background-position: 0 0, 0 0; } 100% { background-position: 150px 150px, -150px 200px; } }

/* ============ 🚨 通胀 / 危机 全屏紧急状态 ============ */
@keyframes emergencyFlash {
 0% { background-color: rgba(139, 0, 0, 0); }
 50% { background-color: rgba(139, 0, 0, 0.35); }
 100% { background-color: rgba(139, 0, 0, 0); }
}
@keyframes screenShake {
 0% { transform: translate(0, 0); }
 20% { transform: translate(-3px, 2px); }
 40% { transform: translate(3px, -2px); }
 60% { transform: translate(-2px, -1px); }
 80% { transform: translate(2px, 1px); }
 100% { transform: translate(0, 0); }
}
#emergency-overlay {
 display: none;
 position: fixed; inset: 0; z-index: 9998;
 pointer-events: none;
 animation: emergencyFlash 0.9s ease-in-out infinite;
}
body.emergency .container { animation: screenShake 0.35s infinite; }
body.emergency #emergency-overlay { display: block; }
body.emergency::after {
 content: '';
 position: fixed; inset: 0; z-index: 9997;
 box-shadow: inset 0 0 140px 40px rgba(220, 38, 38, 0.65);
 pointer-events: none;
}

/* 正面事件用金色光效替代红色警报 */
@keyframes boomFlash {
 0% { background-color: rgba(202, 138, 4, 0); }
 50% { background-color: rgba(202, 138, 4, 0.25); }
 100% { background-color: rgba(202, 138, 4, 0); }
}
body.boomtime #emergency-overlay { display: block; animation: boomFlash 0.9s ease-in-out infinite; }
body.boomtime::after {
 content: '';
 position: fixed; inset: 0; z-index: 9997;
 box-shadow: inset 0 0 140px 40px rgba(250, 204, 21, 0.5);
 pointer-events: none;
}

.siren-bar {
 display: none;
 position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;
 background: repeating-linear-gradient(45deg, #b91c1c, #b91c1c 20px, #7f1d1d 20px, #7f1d1d 40px);
 color: #fff; text-align: center; font-weight: bold; letter-spacing: 2px;
 padding: 10px; font-size: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
body.emergency .siren-bar { display: block; }
body.boomtime .siren-bar {
 display: block;
 background: repeating-linear-gradient(45deg, #ca8a04, #ca8a04 20px, #92610a 20px, #92610a 40px);
}

.container {
 max-width: 1680px; margin: 0 auto; background: var(--panel-bg);
 padding: 30px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
 backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); position: relative;
}
h1 {
 text-align: center; font-size: 2.5rem; margin-bottom: 5px;
 background: linear-gradient(45deg, var(--nature-sky), var(--nature-pink), var(--nature-gold));
 -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 10px rgba(0,0,0,0.4);
}
.setup-screen, .game-screen, .end-screen { display: none; }
.active { display: block; animation: scaleUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes scaleUp { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.btn {
 background: linear-gradient(135deg, #0369a1 0%, #38bdf8 100%); color: white; border: none; padding: 14px 28px;
 font-size: 16px; border-radius: 12px; cursor: pointer; font-weight: bold;
 box-shadow: 0 4px 14px rgba(56, 189, 248, 0.2); transition: all 0.2s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); }
.btn:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.6; }
.btn-accent { background: linear-gradient(135deg, #be123c 0%, #fb7185 100%); box-shadow: 0 4px 14px rgba(251, 113, 133, 0.2); }
.btn-warning { background: linear-gradient(135deg, #b45309 0%, #f59e0b 100%); }
.btn-gold { background: linear-gradient(135deg, #ca8a04 0%, #facc15 100%); color: #451a03; }

.game-layout { display: grid; grid-template-columns: 400px 1fr; gap: 30px; margin-top: 25px; }
@media (max-width: 1000px) { .game-layout { grid-template-columns: 1fr; } .board-3d-stage { height: 560px; } }

.players-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 15px; }
.player-card { border: 1px solid rgba(255,255,255,0.05); border-radius: 18px; padding: 18px; background: rgba(15, 23, 42, 0.6); transition: all 0.4s ease; }
.player-card.current { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); background: rgba(30, 41, 59, 0.85); border-color: var(--nature-sky); }
.player-card p { margin: 6px 0; font-size: 14px; color: #cbd5e1; }

.economy-status { display: flex; gap: 15px; margin-bottom: 20px; padding: 10px 15px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); justify-content: center; font-size: 14px; flex-wrap: wrap; }
.eco-bad { color: var(--nature-red); font-weight: bold; }
.eco-good { color: var(--nature-green); font-weight: bold; }

/* ============ 🎲 骰子 ============ */
.dice-zone { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; }
.dice-face {
 width: 84px; height: 84px; background: linear-gradient(145deg, #ffffff, #dbe4ee);
 border-radius: 16px; display: flex; align-items: center; justify-content: center;
 font-size: 46px; color: #1e293b; box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.05);
 transition: transform 0.12s ease;
}
.dice-face.rolling { animation: diceSpin 0.12s linear infinite; }
@keyframes diceSpin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } 100% { transform: rotate(360deg) scale(1); } }
.dice-result-label { font-size: 13px; color: var(--nature-gold); font-weight: bold; min-height: 16px; }

.board-3d-stage { width: 100%; height: 820px; background: linear-gradient(to bottom, #1e1b4b, #311042, #0f172a); border-radius: 20px; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: inset 0 0 50px rgba(0,0,0,0.8); position: relative; }

.map-status { background: rgba(15, 23, 42, 0.5); color: var(--nature-sky); padding: 16px; border-left: 4px solid var(--nature-sky); border-radius: 12px; margin-bottom: 20px; font-weight: bold; text-align: center; }
.action-zone { border: 2px dashed rgba(56, 189, 248, 0.2); padding: 25px; border-radius: 16px; min-height: 150px; margin-bottom: 20px; background: rgba(15, 23, 42, 0.3); }
.decision-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
.opt-card { border: 1px solid rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; background: rgba(30, 41, 59, 0.8); cursor: pointer; transition: all 0.2s ease; text-align: center; }
.opt-card:hover { border-color: var(--nature-gold); background: rgba(251, 191, 36, 0.05); }
.opt-icon { font-size: 40px; margin-bottom: 8px; }

.log-box { background: #090d16; color: #93c5fd; padding: 15px; border-radius: 14px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 13px; }
.setup-group { margin-bottom: 20px; }
input[type="text"], select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; background-color: #0f172a; color: #fff; box-sizing: border-box; }

.player-setup-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
.player-setup-card > label { display:block; margin-bottom:8px; font-size:14px; font-weight:bold; color: var(--nature-sky); }
.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.avatar-card {
 background: rgba(15, 23, 42, 0.7); border: 2px solid rgba(255,255,255,0.1); border-radius: 14px;
 padding: 10px 6px; text-align: center; cursor: pointer; transition: all 0.2s ease;
}
.avatar-card .avatar-icon { font-size: 32px; display: block; margin-bottom: 4px; }
.avatar-card .avatar-name { font-size: 12px; color: #cbd5e1; }
.avatar-card:hover { border-color: var(--nature-sky); transform: translateY(-2px); }
.avatar-card.selected { border-color: var(--nature-gold); background: rgba(251, 191, 36, 0.12); box-shadow: 0 0 14px rgba(251, 191, 36, 0.3); }
.avatar-card.taken { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
.avatar-card.taken:hover { transform: none; border-color: rgba(255,255,255,0.1); }

.job-badge { display:inline-block; margin-top:6px; font-size:12px; color: var(--nature-gold); background: rgba(251,191,36,0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(251,191,36,0.3); }

.event-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 10000; justify-content: center; align-items: center; }
.event-modal { background: #1e293b; border: 2px solid var(--nature-red); border-radius: 20px; width: 90%; max-width: 600px; overflow: hidden; box-shadow: 0 0 40px rgba(239, 68, 68, 0.4); text-align: center; animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.event-modal.positive { border-color: var(--nature-gold); box-shadow: 0 0 40px rgba(250, 204, 21, 0.4); }
@keyframes dropIn { from { transform: translateY(-50px) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
.event-modal-icon { font-size: 90px; padding: 30px 0 10px; background: rgba(220,38,38,0.15); border-bottom: 3px solid var(--nature-red); }
.event-modal.positive .event-modal-icon { background: rgba(250,204,21,0.15); border-bottom: 3px solid var(--nature-gold); }
.event-modal-content { padding: 30px; }
.event-modal-content h2 { color: var(--nature-red); margin-top: 0; font-size: 26px; }
.event-modal.positive .event-modal-content h2 { color: var(--nature-gold); }
.event-modal-content p { font-size: 16px; line-height: 1.6; color: #cbd5e1; }
.eco-impact-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin: 20px 0; font-family: monospace; }

.market-banner { background: rgba(250, 204, 21, 0.15); border: 1px solid var(--nature-gold); border-radius: 12px; padding: 15px; margin-top: 15px; text-align: left; }

/* ============ 🏆 颁奖典礼 ============ */
.ceremony-loading { font-size: 18px; color: var(--nature-sky); padding: 40px 0; animation: pulseFade 1.2s ease-in-out infinite; }
@keyframes pulseFade { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

.award-list { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.award-card {
 display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.05);
 border: 1px solid rgba(251,191,36,0.3); border-radius: 14px; padding: 14px 18px; text-align: left;
}
.award-icon { font-size: 34px; }
.award-card b { color: var(--nature-gold); font-size: 15px; }
.award-card small { color: #94a3b8; }

@keyframes revealPop {
 0% { opacity: 0; transform: translateY(14px) scale(0.92); }
 60% { opacity: 1; transform: translateY(-3px) scale(1.03); }
 100% { opacity: 1; transform: translateY(0) scale(1); }
}
.reveal-pop { animation: revealPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }

.reveal-list { display: flex; flex-direction: column-reverse; gap: 10px; margin-top: 16px; min-height: 40px; }
.rank-reveal-row {
 background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
 padding: 10px 16px; text-align: left; font-size: 15px;
}
.rank-num { color: var(--nature-sky); font-weight: bold; margin-right: 10px; }

.podium-stage { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin-top: 26px; }
.podium-block {
 width: 130px; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; justify-content: flex-end;
 align-items: center; padding: 10px 6px 14px; text-align: center;
 background: linear-gradient(180deg, rgba(56,189,248,0.25), rgba(15,23,42,0.9));
 border: 1px solid rgba(255,255,255,0.15); border-bottom: none;
 animation: revealPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
}
.podium-medal { font-size: 30px; margin-bottom: 6px; }
.podium-player { font-weight: bold; font-size: 14px; }
.podium-score { color: var(--nature-gold); font-size: 13px; margin-top: 4px; }
.other-ranks { margin-top: 22px; font-size: 13px; color: #94a3b8; text-align: left; max-width: 380px; margin-left:auto; margin-right:auto; }
.other-ranks div { padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="siren-bar" id="siren-bar">🚨 经济紧急状态 · ECONOMIC EMERGENCY · 请立即关注最新政策公告 🚨</div>
<div id="emergency-overlay"></div>

<div class="container">
<h1>机会博弈 (THE TRADE OFF)</h1>
<p style="text-align: center; margin-top: -5px; color: #38bdf8; font-size: 14px; letter-spacing: 2px;">🌤️ 天空之城・多元化沉浸自然沙盘 🦅</p>

<div id="setup-screen" class="setup-screen active">
 <h2>大自然玩家初始化</h2>
 <div class="setup-group">
 <label style="display:block; margin-bottom:8px; font-weight:bold;">选择进入云端营地的动物数量:</label>
 <select id="player-count" onchange="generateNameInputs()">
 <option value="2">2人竞技模式</option>
 <option value="3">3人竞技模式</option>
 <option value="4">4人全员生态大乱斗</option>
 </select>
 </div>
 <div id="name-inputs-container"></div>
 <p id="avatar-warning" style="display:none; color: var(--nature-red); font-weight:bold; text-align:center; margin: 10px 0;">⚠️ 每位探索者的化身必须是独一无二的，请重新选择！</p>
 <p style="text-align:center; font-size:13px; color:#94a3b8;">💼 入场后系统将随机为每位探索者分配一份初始职业，游戏中可通过「跳槽格」更换工作。</p>
 <button class="btn" onclick="startGame()">建立天空世界并入场</button>
</div>

<div id="game-screen" class="game-screen">
 <h2 id="round-title" style="color: var(--nature-sky); text-align: center; margin-bottom: 5px;">第 1 周期</h2>

 <div class="economy-status" id="economy-status">
 <span>🌍 全球状态: <span style="color:var(--nature-sky)">和平稳定</span></span>
 <span>💹 通货膨胀率: <span>1.0x (正常)</span></span>
 <span>💼 薪资发放率: <span>100% (正常)</span></span>
 </div>

 <div class="players-dashboard" id="dashboard"></div>

 <div class="game-layout">
 <div class="control-panel">
 <div class="map-status" id="map-info">等待抛掷幸运浆果...</div>

 <div class="dice-zone">
 <div class="dice-face" id="dice-face">🎲</div>
 <div class="dice-result-label" id="dice-result-label"></div>
 </div>

 <div class="action-zone" id="action-zone"></div>
 <h3 style="font-size:16px; margin-bottom:10px;">天空原野日志</h3>
 <div class="log-box" id="log-box"></div>
 </div>
 <div class="board-3d-stage" id="three-container"></div>
 </div>
</div>

<div id="end-screen" class="end-screen" style="text-align:center;">
 <h2 style="color:var(--nature-green)">天空林间探险圆满结束</h2>
 <div id="leaderboard-zone" style="max-width:560px; margin:20px auto; padding:20px; background:rgba(0,0,0,0.2); border-radius:16px;"></div>
 <button class="btn" onclick="location.reload()" style="margin-top:20px;">重启天空世界</button>
</div>
</div>

<div id="event-modal-overlay" class="event-modal-overlay">
 <div class="event-modal" id="event-modal">
 <div class="event-modal-icon" id="event-icon">🚨</div>
 <div class="event-modal-content">
 <h2 id="event-title">事件标题</h2>
 <p id="event-desc">事件详细描述...</p>
 <div class="eco-impact-box" id="event-impact">影响数值</div>
 <button class="btn btn-warning" style="width: 100%;" onclick="closeEventModal()">确认并应对危机</button>
 </div>
 </div>
</div>

<script>
// ================= 核心游戏数据 =================
let players = [];
let currentPlayerIndex = 0;
let currentRound = 1;
const totalRounds = 12;
let globalInflation = 1.0;
let salaryRate = 1.0;
let economyStateName = "和平稳定";

// ---- 职业系统：每位玩家开局随机分配一份工作，决定收入格/起点的基础薪资 ----
const JOBS = [
 { name: "教师", salary: 2500 },
 { name: "护士", salary: 2550 },
 { name: "厨师", salary: 2600 },
 { name: "工厂员工", salary: 2650 },
 { name: "保安员", salary: 2700 },
 { name: "Grab司机", salary: 2750 },
 { name: "小商贩", salary: 2800 },
 { name: "自由工作者", salary: 2850 },
 { name: "农夫", salary: 2900 },
 { name: "文员", salary: 3000 },
 { name: "会计助理", salary: 3100 },
 { name: "警察", salary: 3200 },
 { name: "程序员", salary: 3300 },
 { name: "工程师", salary: 3400 },
 { name: "公务员", salary: 3500 },
 { name: "会计师", salary: 3800 },
 { name: "建筑师", salary: 4000 },
 { name: "企业经理", salary: 4300 },
 { name: "律师", salary: 4600 },
 { name: "医生", salary: 5000 }
];

function shuffleArray(arr) {
 let a = arr.slice();
 for (let i = a.length - 1; i > 0; i--) {
 const j = Math.floor(Math.random() * (i + 1));
 [a[i], a[j]] = [a[j], a[i]];
 }
 return a;
}

// 每格类型对应的图标 + 主题色，用于棋盘贴图与日志
const tileMeta = {
 "起点": { icon: "🏁", color: "#16a34a" },
 "收入格": { icon: "💰", color: "#22c55e" },
 "支出格": { icon: "💸", color: "#f87171" },
 "银行格": { icon: "🏦", color: "#ea580c" },
 "决策格": { icon: "⚖️", color: "#ca8a04" },
 "投资格": { icon: "📈", color: "#0284c7" },
 "机会格": { icon: "🎁", color: "#9333ea" },
 "风险格": { icon: "⚡", color: "#dc2626" },
 "平安格": { icon: "🍃", color: "#64748b" },
 "拘留格": { icon: "🚔", color: "#334155" },
 "命运格": { icon: "🔮", color: "#7c3aed" },
 "跳槽格": { icon: "💼", color: "#0891b2" }
};

// 🌟 棋盘扩充到 32 格，类型更丰富（4边 x 8格，均匀分布）
const boardTiles = [
 "起点", "收入格", "支出格", "平安格", "决策格", "投资格", "机会格", "风险格",
 "收入格", "支出格", "银行格", "命运格", "跳槽格", "决策格", "支出格", "收入格",
 "拘留格", "投资格", "机会格", "风险格", "决策格", "平安格", "银行格", "命运格",
 "收入格", "支出格", "机会格", "决策格", "投资格", "风险格", "收入格", "支出格"
];

// 🔮 命运格卡片池：随机抽取，正负皆有
const fateCards = [
 { text: "路边捡到许愿金币 +$500", effect: p => { p.money += 500; p.happiness += 1; } },
 { text: "云端小感冒，就医支出 -$200，心情低落 -1❤️", effect: p => { p.money -= 200; p.happiness = Math.max(0, p.happiness - 1); } },
 { text: "彩虹幸运抽奖中奖 +$800", effect: p => { p.money += 800; } },
 { text: "家中云朵发电机损坏，维修 -$400", effect: p => { p.money -= 400; } },
 { text: "老朋友请客聚餐，心情大好 +1❤️", effect: p => { p.happiness += 1; } },
 { text: "不慎遗失钱包 -$300，心情沮丧 -1❤️", effect: p => { p.money -= 300; p.happiness = Math.max(0, p.happiness - 1); } },

 }

 triggeredEventCount++;
 runMacroEvent(chosenEvent);
 } else {
 startPlayerTurnInit();
 }
}

function createTileTexture(tileName) {
 const meta = tileMeta[tileName] || { icon: "❔", color: "#475569" };
 const S = 320; // 高分辨率画布，确保贴到 3D 方块上文字依旧清晰
 let canvas = document.createElement('canvas');
 canvas.width = S; canvas.height = S;
 let ctx = canvas.getContext('2d');
 ctx.fillStyle = meta.color;
 ctx.fillRect(0, 0, S, S);
 ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
 ctx.lineWidth = 12;
 ctx.strokeRect(12, 12, S - 24, S - 24);

 // 大号图标，居中偏上
 ctx.font = "150px 'Segoe UI Emoji', Arial";
 ctx.textAlign = "center";
 ctx.textBaseline = "middle";
 ctx.fillText(meta.icon, S / 2, S * 0.40);

 // 文字标签底部加一条深色高对比底条，确保任何底色下都清晰可读
 ctx.fillStyle = "rgba(0,0,0,0.55)";
 ctx.fillRect(0, S * 0.72, S, S * 0.28);

 ctx.font = "bold 46px 'Segoe UI', Arial, sans-serif";
 ctx.fillStyle = "#ffffff";
 ctx.shadowColor = "rgba(0,0,0,0.8)";
 ctx.shadowBlur = 6;
 ctx.fillText(tileName, S / 2, S * 0.87);
 return new THREE.CanvasTexture(canvas);
}

function plant3DForestEnvironment() {

 for (let i = 0; i < 10; i++) {

 trunk.position.y = 1.6;

// 棋盘扩展为 24 格环形跑道：4 边，每边 6 格，均匀分布（沿用原先的扁平网格风格）
function get3DGridPosition(tileIndex, playerIdx = 0) {
 const N = boardTiles.length;
 const perSide = N / 4;
 const size = 80, step = size / perSide, start = -size / 2 + step / 2;
 const side = Math.floor(tileIndex / perSide);
 const posInSide = tileIndex % perSide;
 let x = 0, z = 0;
 if (side === 0) { x = start + posInSide * step; z = start; }
 else if (side === 1) { x = start + (perSide - 1) * step; z = start + posInSide * step; }
 else if (side === 2) { x = start + (perSide - 1 - posInSide) * step; z = start + (perSide - 1) * step; }
 else { x = start; z = start + (perSide - 1 - posInSide) * step; }
 if (playerIdx === 0) { x -= 1.4; z -= 1.4; }
 if (playerIdx === 1) { x += 1.4; z -= 1.4; }
 if (playerIdx === 2) { x -= 1.4; z += 1.4; }
 if (playerIdx === 3) { x += 1.4; z += 1.4; }
 return new THREE.Vector3(x, 0.28, z);
}

function build3DGridBoard() {
 const N = boardTiles.length;
 const perSide = N / 4;
 const size = 80, step = size / perSide;

 let baseGeo = new THREE.BoxGeometry(90, 0.3, 90);
 let baseMat = new THREE.MeshStandardMaterial({ color: 0x1c2431, roughness: 0.8 });
 let base = new THREE.Mesh(baseGeo, baseMat);
 base.position.set(0, -0.15, 0);
 base.receiveShadow = true;
 scene.add(base);

 for (let i = 0; i < boardTiles.length; i++) {
 let pos = get3DGridPosition(i, -1);
 let texture = createTileTexture(boardTiles[i]);
 let sideMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });
 let topMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.4 });
 let mesh = new THREE.Mesh(
 new THREE.BoxGeometry(step - 0.8, 0.18, step - 0.8),
 [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]
 );
 mesh.position.set(pos.x, 0.05, pos.z);
 mesh.receiveShadow = true;
 scene.add(mesh);
 tileMeshes.push(mesh);
 }
}

function createVoxelAnimal(type, baseColor) {
 let group = new THREE.Group();
 let mat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.5 });
 let body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 2.2), mat);
 body.position.y = 0.9; body.castShadow = true;
 group.add(body);
 let head = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), mat);
 head.position.set(0, 2.2, 0.4);
 group.add(head);
 let eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
 let leye = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), eyeMat);
 leye.position.set(0.6, 2.4, 1.2);
 let reye = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), eyeMat);
 reye.position.set(-0.6, 2.4, 1.2);
 group.add(leye, reye);
 if (type === "fox") {
 let tail = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 1.6), mat);
 tail.position.set(0, 0.9, -1.4);
 group.add(tail);
 } else if (type === "dino") {
 let tail = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.8), mat);
 tail.position.set(0, 0.8, -1.4);
 group.add(tail);
 }
 group.scale.set(1.2, 1.2, 1.2);
 return group;
}

function animate() {
 requestAnimationFrame(animate);
 globalPulseTime += 0.04;
 if (isAnimating && jumpData) {
 jumpData.elapsed += 0.055;
 if (jumpData.elapsed >= 1) {
 jumpData.currentStep++;
 if (jumpData.currentStep < jumpData.totalSteps) {
 let fromIdx = (jumpData.startIdx + jumpData.currentStep - 1) % boardTiles.length;
 let toIdx = (jumpData.startIdx + jumpData.currentStep) % boardTiles.length;
 jumpData.startPos.copy(get3DGridPosition(fromIdx, jumpData.pIdx));
 jumpData.targetPos.copy(get3DGridPosition(toIdx, jumpData.pIdx));
 jumpData.elapsed = 0;
 } else {
 animalMeshes[jumpData.pIdx].position.copy(get3DGridPosition(jumpData.finalTarget, jumpData.pIdx));
 animalMeshes[jumpData.pIdx].scale.set(1.2, 1.2, 1.2);
 isAnimating = false;
 let p = jumpData.player;
 p.position = jumpData.finalTarget;
 let tile = boardTiles[p.position];
 let icon = (tileMeta[tile] || {}).icon || "";
 document.getElementById('map-info').innerText = `${icon} 小动物安全降落：【${tile}】`;
 handleTileEffect(p, tile);
 jumpData = null;
 }
 } else {
 let mesh = animalMeshes[jumpData.pIdx], t = jumpData.elapsed;
 mesh.position.x = jumpData.startPos.x + (jumpData.targetPos.x - jumpData.startPos.x) * t;
 mesh.position.z = jumpData.startPos.z + (jumpData.targetPos.z - jumpData.startPos.z) * t;
 mesh.position.y = jumpData.startPos.y + Math.sin(t * Math.PI) * 6.5;
 let squish = 1 + Math.sin(t * Math.PI) * 0.4;
 mesh.scale.set(1.2 / squish, 1.2 * squish, 1.2 / squish);
 mesh.lookAt(jumpData.targetPos.x, mesh.position.y, jumpData.targetPos.z);
 }
 } else {
 animalMeshes.forEach((mesh, idx) => {
 if (!isAnimating) {
 let tilePos = get3DGridPosition(players[idx].position, idx);
 mesh.position.y = tilePos.y + Math.sin(globalPulseTime + idx * 2) * 0.15;
 }
 });
 }
 renderer.render(scene, camera);
}

// ================= 🎲 掷骰子：先做滚动动画，显示明确结果，再驱动棋子跳跃 =================
function playTurn() {
 if (isAnimating) return;
 let p = players[currentPlayerIndex];
 document.getElementById('dice-btn').disabled = true;

 const diceFace = document.getElementById('dice-face');
 const resultLabel = document.getElementById('dice-result-label');
 diceFace.classList.add('rolling');
 resultLabel.innerText = "骰子滚动中...";

 let rollCount = 0;
 const rollInterval = setInterval(() => {
 let tempVal = Math.floor(Math.random() * 6) + 1;
 diceFace.innerText = diceUnicode[tempVal];
 rollCount++;
 if (rollCount >= 14) {
 clearInterval(rollInterval);
 let dice = Math.floor(Math.random() * 6) + 1;
 diceFace.innerText = diceUnicode[dice];
 diceFace.classList.remove('rolling');
 resultLabel.innerText = `🎯 点数结果：${dice} 点！`;

 let finalTarget = (p.position + dice) % boardTiles.length;
 document.getElementById('map-info').innerText = `【${p.name}】掷出 ${dice} 点，看！棋子正在逐格跳跃...`;
 jumpData = {
 player: p, pIdx: currentPlayerIndex, startIdx: p.position, finalTarget: finalTarget,
 currentStep: 0, totalSteps: dice,
 startPos: get3DGridPosition(p.position, currentPlayerIndex).clone(),
 targetPos: get3DGridPosition((p.position + 1) % boardTiles.length, currentPlayerIndex).clone(),
 elapsed: 0
 };
 isAnimating = true;
 }
 }, 80);
}

// ================= 游戏交互逻辑 =================
function handleTileEffect(player, tileType) {
 const zone = document.getElementById('action-zone');
 const actualIncome = baseIncomeFor(player);
 const actualExpense = Math.floor(500 * globalInflation);

 if (tileType === "起点" || tileType === "收入格") {
 player.money += actualIncome;
 log(`💰 【${player.name}】以「${player.job.name}」身份领取薪资：+$${actualIncome}`);
 showAllocationPhase();
 } else if (tileType === "支出格") {
 player.money -= actualExpense;
 log(`💸 ${player.name} 遭遇突发支出：-$${actualExpense}${globalInflation > 1 ? ' (通胀加剧!)' : ''}`);
 showAllocationPhase();
 } else if (tileType === "风险格") {
 player.happiness = Math.max(0, player.happiness - 1);
 log(`⚡ ${player.name} 误入乌云雷区，幸福感 -1`);
 showAllocationPhase();
 } else if (tileType === "平安格") {
 log(`🍃 ${player.name} 平安路过云端草地，什么都没有发生。`);
 showAllocationPhase();
 } else if (tileType === "拘留格") {
 const fine = Math.floor(400 * globalInflation);
 player.money -= fine;
 player.usedHustleThisTurn = true;
 log(`🚔 ${player.name} 被困云端拘留所，缴纳保释金 -$${fine}，本回合无法兼职。`);
 showAllocationPhase();
 } else if (tileType === "命运格") {
 const card = fateCards[Math.floor(Math.random() * fateCards.length)];
 card.effect(player);
 log(`🔮 ${player.name} 抽到命运卡片：${card.text}`);
 showAllocationPhase();
 } else if (tileType === "跳槽格") {
 showJobOffers();
 } else if (tileType === "银行格") {
 zone.innerHTML = `<p><b>🏦 云端储物岩洞</b></p><button class="btn" onclick="bankAction('deposit')">💰 存入保值储备 $1000</button> <button class="btn btn-accent" onclick="showAllocationPhase()">断开连接</button>`;
 } else if (tileType === "投资格") {
 zone.innerHTML = `<p><b>📈 浮空岛基金所</b></p><button class="btn" onclick="investAction(true)">🚀 众筹开拓新浮岛 $1000</button> <button class="btn btn-accent" onclick="showAllocationPhase()">拒绝风险</button>`;
 } else if (tileType === "机会格") {
 player.money += 1000;
 log(`🎁 【${player.name}】捕获许愿流星红利 +$1000`);
 showAllocationPhase();
 } else if (tileType === "决策格") {
 zone.innerHTML = `
 <p><b>⚖️ 机会成本抉择：</b></p>
 <div class="decision-box">
 <div class="opt-card" onclick="chooseDecision('A')">
 <div class="opt-icon">💼</div>
 <h4>方案 A: 加班熬夜做项目</h4><p style="color:var(--nature-green)">+$1200</p><p style="color:var(--nature-pink)">-1❤️</p>
 </div>
 <div class="opt-card" onclick="chooseDecision('B')">
 <div class="opt-icon">🏖️</div>
 <h4>方案 B: 陪伴家人去旅行</h4><p style="color:var(--nature-pink)">-$${Math.floor(400 * globalInflation)}</p><p style="color:var(--nature-green)">+2❤️</p>
 </div>
 </div>`;
 }
 updateUI();
}

function showJobOffers() {
 const zone = document.getElementById('action-zone');
 const p = players[currentPlayerIndex];
 const others = shuffleArray(JOBS.filter(j => j.name !== p.job.name)).slice(0, 3);
 zone.innerHTML = `
 <p><b>💼 云端招聘集市：是否要跳槽？</b></p>
 <p style="font-size:13px; color:#94a3b8;">当前职业：${p.job.name}（基准薪资 $${p.job.salary}）</p>
 <div class="decision-box" style="grid-template-columns: repeat(3, 1fr);">
 ${others.map(j => `
 <div class="opt-card" onclick="changeJob('${j.name}')">
 <div class="opt-icon">💼</div>
 <h4 style="font-size:14px;">${j.name}</h4>
 <p style="color:var(--nature-gold);">$${j.salary}</p>
 </div>`).join('')}
 </div>
 <button class="btn btn-accent" style="margin-top:12px;" onclick="showAllocationPhase()">保留当前工作</button>
 `;
}

function changeJob(name) {
 const p = players[currentPlayerIndex];
 const job = JOBS.find(j => j.name === name);
 if (job) {
 p.job = job;
 log(`💼 ${p.name} 跳槽成为了「${name}」，基准薪资调整为 $${job.salary}`);
 }
 showAllocationPhase();
}

function bankAction(type) {
 let p = players[currentPlayerIndex];
 if (p.money >= 1000) { p.money -= 1000; p.savings += 1000; log(`🏦 ${p.name} 存入 $1000 到储备金`); }
 showAllocationPhase();
}
function investAction(confirm) {
 let p = players[currentPlayerIndex];
 if (confirm && p.money >= 1000) {
 p.money -= 1000;
 p.investCount = (p.investCount || 0) + 1;
 let win = Math.random() > 0.48;
 p.money += win ? 1900 : 100;
 log(win ? `📈 ${p.name} 投资成功，净赚 $900！` : `📉 ${p.name} 投资失利，仅剩 $100 残值。`);
 }
 showAllocationPhase();
}
function chooseDecision(choice) {
 let p = players[currentPlayerIndex];
 if (choice === 'A') {
 p.money += 1200; p.happiness = Math.max(0, p.happiness - 1);
 log(`💼 ${p.name} 选择了高强度加班`);
 } else {
 p.money -= Math.floor(400 * globalInflation); p.happiness += 2;
 log(`🏖️ ${p.name} 选择了陪伴家人`);
 }
 showAllocationPhase();
}
function showAllocationPhase() {
 updateUI();
 let p = players[currentPlayerIndex];
 document.getElementById('action-zone').innerHTML = `
 <p>🕒 <b>本轮暮色结算：</b>${p.usedHustleThisTurn ? '本回合兼职机会已用完' : '要不要抓紧兼职赚一笔？'}</p>
 <button class="btn" style="font-size:12px; padding:8px 12px; margin-right:5px;" onclick="doSideHustle()" ${p.usedHustleThisTurn ? 'disabled' : ''}>💪 兼职一次 (+$${Math.floor(300 * salaryRate)})</button>
 <button class="btn btn-accent" style="font-size:12px; padding:8px 12px;" onclick="nextPlayerTurn()">🌙 休眠进入下一轮</button>
 `;
}
function doSideHustle() {
 let p = players[currentPlayerIndex];
 if (!p.usedHustleThisTurn) {
 p.usedHustleThisTurn = true;
 p.money += Math.floor(300 * salaryRate);
 showAllocationPhase();
 }
}
function nextPlayerTurn() {
 currentPlayerIndex++;
 if (currentPlayerIndex >= players.length) {
 currentPlayerIndex = 0;
 currentRound++;
 if (currentRound > totalRounds) {
 document.getElementById('game-screen').classList.remove('active');
 document.getElementById('end-screen').classList.add('active');
 runAwardsCeremony();
 return;
 } else {
 checkAndTriggerMacroEvent();
 return;
 }
 }
 startPlayerTurnInit();
}

// ================= 🏆 颁奖典礼（Quizizz 风格 Podium） =================
function netWorth(p) { return p.money + p.savings + p.assetsValue; }
function overallScore(p) { return netWorth(p) + p.happiness * 300; }

function runAwardsCeremony() {
 const zone = document.getElementById('leaderboard-zone');
 zone.innerHTML = `<div class="ceremony-loading">📊 正在核算天空之城最终成绩...</div>`;
 setTimeout(showSpecialAwards, 1800);
}

function showSpecialAwards() {
 const zone = document.getElementById('leaderboard-zone');
 zone.innerHTML = `<h3 style="color:var(--nature-gold); margin-bottom:4px;">🎖️ 特别荣誉奖项</h3><div id="award-list" class="award-list"></div>`;
 const richest = [...players].sort((a, b) => netWorth(b) - netWorth(a))[0];
 const happiest = [...players].sort((a, b) => b.happiness - a.happiness)[0];
 const riskiest = [...players].sort((a, b) => (b.investCount || 0) - (a.investCount || 0))[0];

 const awards = [
 { icon: "💰", title: "首富", p: richest, detail: `净资产 $${netWorth(richest)}` },
 { icon: "😊", title: "最幸福玩家", p: happiest, detail: `幸福指数 ${happiest.happiness}` }
 ];
 if (riskiest.investCount > 0) {
 awards.push({ icon: "🎲", title: "风险之王", p: riskiest, detail: `累计投资 ${riskiest.investCount} 次` });
 }

 const list = document.getElementById('award-list');
 let i = 0;
 function revealNext() {
 if (i >= awards.length) { setTimeout(showPodiumReveal, 1000); return; }
 const a = awards[i];
 const div = document.createElement('div');
 div.className = 'award-card reveal-pop';
 div.innerHTML = `<span class="award-icon">${a.icon}</span><div><b>${a.title}</b><br>${a.p.icon} ${a.p.name}<br><small>${a.detail}</small></div>`;
 list.appendChild(div);
 i++;
 setTimeout(revealNext, 950);
 }
 revealNext();
}

function showPodiumReveal() {
 const zone = document.getElementById('leaderboard-zone');
 const ranked = [...players].sort((a, b) => overallScore(b) - overallScore(a));
 zone.innerHTML = `
 <h3 style="color:var(--nature-gold); margin-bottom:4px;">🏆 综合总冠军揭晓</h3>
 <p style="font-size:12px; color:#94a3b8; margin-top:0;">综合积分 = 净资产 + 幸福指数 × 300</p>
 <div id="reveal-list" class="reveal-list"></div>`;
 const revealList = document.getElementById('reveal-list');
 const order = [...ranked].reverse(); // 从最后一名开始揭晓
 let idx = 0;
 function revealOne() {
 if (idx >= order.length) { setTimeout(() => buildPodiumStage(ranked), 900); return; }
 const rankNum = order.length - idx;
 const p = order[idx];
 const div = document.createElement('div');
 div.className = 'rank-reveal-row reveal-pop';
 div.innerHTML = `<span class="rank-num">No.${rankNum}</span>${p.icon} <b>${p.name}</b> — 综合积分 $${overallScore(p)}`;
 revealList.appendChild(div);
 idx++;
 setTimeout(revealOne, 950);
 }
 revealOne();
}

function buildPodiumStage(ranked) {
 const zone = document.getElementById('leaderboard-zone');
 const top3 = ranked.slice(0, 3);
 const others = ranked.slice(3);
 const heights = [110, 150, 90]; // 视觉顺序：亚军-冠军-季军
 const visualOrder = [top3[1], top3[0], top3[2]];
 const medals = ["🥈", "🥇", "🥉"];

 zone.innerHTML += `<div id="podium-stage" class="podium-stage"></div>`;
 const stage = document.getElementById('podium-stage');
 stage.innerHTML = visualOrder.map((p, i) => p ? `
 <div class="podium-block" style="height:${heights[i]}px; animation-delay:${i * 0.25}s;">
 <div class="podium-medal">${medals[i]}</div>
 <div class="podium-player">${p.icon} ${p.name}</div>
 <div class="podium-score">$${overallScore(p)}</div>
 </div>` : '').join('');

 if (others.length > 0) {
 const otherDiv = document.createElement('div');
 otherDiv.className = 'other-ranks';
 otherDiv.innerHTML = others.map((p, i) => `<div>No.${i + 4} ${p.icon} ${p.name} — $${overallScore(p)}</div>`).join('');
 zone.appendChild(otherDiv);
 }
}
</script>
